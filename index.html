<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SLL - BOM DB DEPT</title>

<style>

:root{
  --primary:#0b3d91;
  --primary-dark:#062b68;
  --accent:#6dbc6b;
  --bg:#eef3f8;
  --card:#ffffff;
  --text:#18212f;
  --muted:#667085;
  --border:#d9e1ea;
  --danger:#c62828;
  --shadow:0 8px 24px rgba(15,38,71,.10);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:linear-gradient(180deg,#eef4f9 0%,#f7f9fc 100%);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}


/* =====================================================
   LOCK PAGE
===================================================== */

#lockPage{
  position:fixed;
  inset:0;
  z-index:99999;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;

  background:
    linear-gradient(
      135deg,
      #062b68 0%,
      #0b3d91 50%,
      #1769aa 100%
    );
}

.lock-box{
  width:min(420px,92%);
  background:#fff;
  padding:35px 30px;
  border-radius:20px;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.30);
}

.lock-icon{
  width:80px;
  height:80px;
  margin:0 auto 15px;

  display:flex;
  justify-content:center;
  align-items:center;

  border-radius:50%;
  background:#e8f1ff;

  font-size:40px;
}

.lock-box h1{
  margin:0;
  color:#0b3d91;
  font-size:25px;
}

.lock-box p{
  margin:8px 0 25px;
  color:#667085;
  font-size:14px;
}

.lock-input{
  width:100%;
  height:48px;

  padding:10px 14px;

  border:1px solid #cbd5e1;
  border-radius:9px;

  font-size:16px;
  text-align:center;

  outline:none;
}

.lock-input:focus{
  border-color:#1769aa;

  box-shadow:
    0 0 0 3px rgba(23,105,170,.12);
}

.unlock-btn{
  width:100%;
  height:48px;

  margin-top:14px;

  border:0;
  border-radius:9px;

  background:#0b3d91;
  color:#fff;

  font-size:16px;
  font-weight:700;

  cursor:pointer;
}

.unlock-btn:hover{
  background:#062b68;
}

.lock-error{
  display:none;

  margin-top:13px;
  padding:10px;

  border-radius:8px;

  background:#fee4e2;
  color:#b42318;

  font-size:13px;
  font-weight:700;
}

.lock-footer{
  margin-top:20px;

  font-size:11px;
  color:#98a2b3;
}


/* =====================================================
   DASHBOARD
===================================================== */

#dashboard{
  display:none;
}

header{
  background:
    linear-gradient(
      135deg,
      #0b3d91 0%,
      #1769aa 55%,
      #6dbc6b 100%
    );

  color:#fff;

  padding:18px 20px 22px;

  text-align:center;

  box-shadow:
    0 4px 18px rgba(0,0,0,.14);
}

.header-inner{
  max-width:1250px;
  margin:auto;
}

.logo{
  display:block;

  width:min(210px,55vw);
  max-height:70px;

  object-fit:contain;

  margin:0 auto 10px;

  background:#005faa;

  padding:7px 12px;

  border-radius:10px;
}

header h1{
  margin:0;

  font-size:clamp(22px,4vw,32px);

  letter-spacing:.3px;
}

header p{
  margin:8px 0 0;

  font-size:14px;

  opacity:.95;
}


/* =====================================================
   CONTAINER
===================================================== */

.container{
  max-width:1250px;

  margin:24px auto;

  padding:0 16px 40px;
}


/* =====================================================
   SEARCH BOX
===================================================== */

.search-box{
  background:var(--card);

  padding:22px;

  border-radius:16px;

  box-shadow:var(--shadow);

  border:
    1px solid rgba(217,225,234,.8);
}

.search-box h2{
  margin:0 0 18px;

  font-size:21px;

  color:var(--primary);
}

.search-grid{
  display:grid;

  grid-template-columns:
    2fr 1fr auto;

  gap:12px;

  align-items:end;
}

.field label{
  display:block;

  font-size:13px;

  font-weight:700;

  color:#475467;

  margin-bottom:6px;
}

input,
select{
  width:100%;
  height:46px;

  padding:10px 13px;

  border:
    1px solid #cbd5e1;

  border-radius:9px;

  font-size:15px;

  outline:none;

  background:#fff;

  transition:.2s;
}

input:focus,
select:focus{
  border-color:#1769aa;

  box-shadow:
    0 0 0 3px rgba(23,105,170,.12);
}

button{
  height:46px;

  padding:0 18px;

  border:0;

  border-radius:9px;

  background:var(--primary);

  color:#fff;

  font-size:15px;

  font-weight:700;

  cursor:pointer;

  transition:.2s;

  white-space:nowrap;
}

button:hover{
  background:var(--primary-dark);

  transform:translateY(-1px);
}

.search-actions{
  display:flex;
  gap:8px;
}

.clear-btn{
  background:#64748b;
}

.clear-btn:hover{
  background:#475569;
}


/* =====================================================
   RESULT COUNT
===================================================== */

#resultCount{
  margin-top:16px;

  padding:10px 12px;

  border-radius:8px;

  background:#f1f5f9;

  color:#334155;

  font-size:14px;

  font-weight:700;
}


/* =====================================================
   BOM GRID
===================================================== */

.bom-grid{
  display:grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(340px,1fr)
    );

  gap:18px;

  margin-top:22px;
}

.bom-card{
  background:#fff;

  border-radius:15px;

  padding:19px;

  box-shadow:var(--shadow);

  border:
    1px solid var(--border);

  overflow:hidden;
}

.bom-card h3{
  margin:0 0 15px;

  color:var(--primary);

  font-size:20px;

  padding-bottom:12px;

  border-bottom:
    2px solid #e8eef5;
}

.characteristics{
  margin:0;
}

.characteristics div{
  display:grid;

  grid-template-columns:
    minmax(135px,42%) 1fr;

  gap:8px;

  padding:9px 0;

  border-bottom:
    1px solid #edf1f5;

  line-height:1.35;

  font-size:14px;

  word-break:break-word;
}

.characteristics div:last-child{
  border-bottom:0;
}

.label{
  font-weight:700;
  color:#475467;
}

.value{
  color:#101828;
}


/* =====================================================
   EMPTY MESSAGE
===================================================== */

.empty{
  grid-column:1/-1;

  text-align:center;

  padding:35px 20px;

  background:#fff;

  border-radius:15px;

  box-shadow:var(--shadow);
}

.empty h3{
  margin:0 0 8px;

  color:#b42318;
}


/* =====================================================
   LOCK DASHBOARD BUTTON
===================================================== */

.lock-dashboard-btn{
  margin-top:25px;

  background:#c62828;
}

.lock-dashboard-btn:hover{
  background:#9f1f1f;
}


/* =====================================================
   FOOTER
===================================================== */

footer{
  text-align:center;

  color:#667085;

  font-size:12px;

  padding:8px 16px 25px;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:850px){

  .search-grid{
    grid-template-columns:1fr;
  }

  .search-actions{
    display:grid;

    grid-template-columns:
      1fr 1fr;
  }

  .bom-grid{
    grid-template-columns:1fr;
  }

}

@media(max-width:520px){

  header{
    padding:15px 12px 18px;
  }

  .container{
    padding:0 10px 30px;

    margin-top:14px;
  }

  .search-box{
    padding:16px;
  }

  .bom-card{
    padding:15px;
  }

  .characteristics div{
    grid-template-columns:1fr;

    gap:3px;
  }

  .search-actions{
    grid-template-columns:1fr;
  }

}

</style>
</head>


<body>


<!-- =====================================================
     LOCK PAGE
===================================================== -->

<div id="lockPage">

  <div class="lock-box">

    <div class="lock-icon">
      🔐
    </div>

    <h1>
      SLL - BOM DB DEPT
    </h1>

    <p>
      Enter password to access BOM Dashboard
    </p>

    <input
      type="password"
      id="passwordInput"
      class="lock-input"
      placeholder="Enter Password"
      autocomplete="off"
    >

    <button
      class="unlock-btn"
      onclick="unlockDashboard()"
    >
      🔓 UNLOCK DASHBOARD
    </button>

    <div
      id="lockError"
      class="lock-error"
    >
      ❌ Incorrect Password
    </div>

    <div class="lock-footer">
      🔒 Secure BOM Access
    </div>

  </div>

</div>


<!-- =====================================================
     DASHBOARD
===================================================== -->

<div id="dashboard">

  <header>

    <div class="header-inner">

      <img
        class="logo"
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQAwsF_JrAIrPMCWZZDAkXtSFxNFo82VMtGO4nEkZbIdg&s=10"
        alt="Company Logo"
        onerror="this.style.display='none'"
      >

      <h1>
        📋 SLL - BOM DASHBOARD
      </h1>

      <p>
        Search BOM using any of the available characteristics
      </p>

    </div>

  </header>


  <div class="container">


    <!-- SEARCH -->

    <div class="search-box">

      <h2>
        🔎 SEARCHING BOM
      </h2>

      <div class="search-grid">


        <div class="field">

          <label for="searchInput">
            Search value
          </label>

          <input
            type="text"
            id="searchInput"
            placeholder="Enter FG No, Model, Material, Cluster, Country, etc."
            autocomplete="off"
            onkeyup="searchBOM()"
          >

        </div>


        <div class="field">

          <label for="characteristic">
            Search in
          </label>

          <select id="characteristic">

            <option value="all">
              Search All 14 Characteristics
            </option>

            <option value="partNo">
              1. FG Number
            </option>

            <option value="dashboarddescription">
              2. Dashboard Description
            </option>

            <option value="country">
              3. Country
            </option>

            <option value="plasticdashboard">
              4. Plastic Dashboard
            </option>

            <option value="covercluster">
              5. Cover Plastic
            </option>

            <option value="InstrumentCluster">
              6. Instrument Cluster
            </option>

            <option value="Lockset">
              7. Lock Set
            </option>

            <option value="Onofflabel">
              8. On Off Label
            </option>

            <option value="Fmradiolabel">
              9. FM Radio
            </option>

            <option value="plug">
              10. Plug
            </option>

            <option value="button">
              11. Button
            </option>

            <option value="label">
              12. Instruction Label
            </option>

            <option value="shocketcharger">
              13. Socket Charger
            </option>

            <option value="dashboardcolour">
              14. DB Colour
            </option>

          </select>

        </div>


        <div class="search-actions">

          <button onclick="searchBOM()">
            🔍 SEARCH
          </button>

          <button
            class="clear-btn"
            onclick="clearSearch()"
          >
            ↺ CLEAR
          </button>

        </div>

      </div>


      <div
        id="resultCount"
        aria-live="polite"
      ></div>

    </div>


    <!-- BOM LIST -->

    <div
      id="bomList"
      class="bom-grid"
    ></div>


    <!-- LOCK -->

    <div style="text-align:center;">

      <button
        class="lock-dashboard-btn"
        onclick="lockDashboard()"
      >
        🔒 LOCK DASHBOARD
      </button>

    </div>

  </div>


  <footer>
    SLL - BOM Dashboard
  </footer>

</div>


<script>

/* =====================================================
   PASSWORD
===================================================== */

const BOM_PASSWORD = "11";


/* =====================================================
   UNLOCK DASHBOARD
===================================================== */

function unlockDashboard(){

  const password =
    document.getElementById(
      "passwordInput"
    ).value;

  const error =
    document.getElementById(
      "lockError"
    );


  if(password === BOM_PASSWORD){

    document.getElementById(
      "lockPage"
    ).style.display = "none";

    document.getElementById(
      "dashboard"
    ).style.display = "block";

    error.style.display = "none";

    document.getElementById(
      "passwordInput"
    ).value = "";

    displayBOM([]);

  }

  else{

    error.style.display = "block";

    document.getElementById(
      "passwordInput"
    ).value = "";

    document.getElementById(
      "passwordInput"
    ).focus();

  }

}


/* =====================================================
   ENTER KEY
===================================================== */

document
  .getElementById("passwordInput")
  .addEventListener(
    "keydown",
    function(event){

      if(event.key === "Enter"){
        unlockDashboard();
      }

    }
  );


/* =====================================================
   LOCK DASHBOARD
===================================================== */

function lockDashboard(){

  document.getElementById(
    "dashboard"
  ).style.display = "none";

  document.getElementById(
    "lockPage"
  ).style.display = "flex";

  document.getElementById(
    "passwordInput"
  ).value = "";

  document.getElementById(
    "lockError"
  ).style.display = "none";

  window.scrollTo(0,0);


  setTimeout(function(){

    document.getElementById(
      "passwordInput"
    ).focus();

  },100);

}


/* =====================================================
   EMPTY BOM DATABASE
===================================================== */

const bomData = [];


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

  return String(value ?? "NA")

    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   DISPLAY BOM
===================================================== */

function displayBOM(data){

  const list =
    document.getElementById(
      "bomList"
    );

  const count =
    document.getElementById(
      "resultCount"
    );


  list.innerHTML = "";


  count.textContent =
    `Found BOM: ${data.length}`;


  if(data.length === 0){

    list.innerHTML = `

      <div class="empty">

        <h3>
          📭 No BOM Data Available
        </h3>

        <p>
          BOM database is currently empty.
        </p>

      </div>

    `;

    return;

  }


  data.forEach(bom => {

    const rows = [

      ["1. FG Number",bom.partNo],

      ["2. DB Description",
       bom.dashboarddescription],

      ["3. Country",bom.country],

      ["4. Plastic DB",
       bom.plasticdashboard],

      ["5. Cover Cluster",
       bom.covercluster],

      ["6. Instrument Cluster",
       bom.InstrumentCluster],

      ["7. Lock Set",
       bom.Lockset],

      ["8. ON/OFF Label",
       bom.Onofflabel],

      ["9. FM Radio",
       bom.Fmradiolabel],

      ["10. Plug",bom.plug],

      ["11. Button",bom.button],

      ["12. Instruction Label",
       bom.label],

      ["13. Socket Charger",
       bom.shocketcharger],

      ["14. DB Colour",
       bom.dashboardcolour]

    ];


    const rowsHTML =
      rows
        .map(([label,value]) => `

          <div>

            <span class="label">
              ${escapeHTML(label)}
            </span>

            <span class="value">
              ${escapeHTML(value || "NA")}
            </span>

          </div>

        `)
        .join("");


    list.insertAdjacentHTML(
      "beforeend",

      `

      <article class="bom-card">

        <h3>
          📕 ${escapeHTML(bom.partNo)}
        </h3>

        <div class="characteristics">

          ${rowsHTML}

        </div>

      </article>

      `
    );

  });

}


/* =====================================================
   SEARCH BOM
===================================================== */

function searchBOM(){

  const search =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();


  const type =
    document
      .getElementById("characteristic")
      .value;


  if(search === ""){

    displayBOM(bomData);

    return;

  }


  const result =
    bomData.filter(bom => {

      if(type === "all"){

        return Object
          .values(bom)
          .some(value =>
            String(value)
              .toLowerCase()
              .includes(search)
          );

      }


      return String(
        bom[type] ?? ""
      )
      .toLowerCase()
      .includes(search);

    });


  displayBOM(result);

}


/* =====================================================
   CLEAR SEARCH
===================================================== */

function clearSearch(){

  document
    .getElementById("searchInput")
    .value = "";


  document
    .getElementById("characteristic")
    .value = "all";


  displayBOM(bomData);


  document
    .getElementById("searchInput")
    .focus();

}


/* =====================================================
   INITIAL DISPLAY
===================================================== */

displayBOM(bomData);

</script>

</body>
</html>
```
